<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- 1. Professional Favicon (Replace with your initials or a tech icon) -->
  <link rel="icon" type="image/png" href="/log.png" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0066cc" />

  <!-- 2. SEO Metadata -->
  <title>Sakshi Chavan | Backend & AI Engineer | GSSoC '26</title>
  <meta name="description"
    content="3rd Year CS Student (9.68 CGPA) specializing in Spring Boot, Deep Learning, and Scalable Architectures. Builder of Nivaran and FinSim." />

    content="Sakshi Chavan, Backend Developer, Spring Boot, Deep Learning, AI Engineer, Navi Mumbai, Terna Engineering College, Java, Fintech" />

    content="Backend Developer & AI Specialist. See my work on high-performance banking engines and NLP systems." />

  <meta name="twitter:card" content="summary_large_image" />

  <!-- 4. Google Fonts (Pre-loading for performance) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Poppins:wght@400;700&display=swap"
    rel="stylesheet">

  <style>
    /* Prevent layout shift before React loads */
    body {
      margin: 0;
      background-color: #0b0e14;
      /* Match your portfolio background color */
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
